name: CI
on:
  push:
    branches: [main, "personal/**"]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # ubuntu-latest spans several CPU generations, and the cache below carries
      # native/target between them. The default `-C target-cpu=native` from
      # native/.cargo/config.toml bakes the builder's ISA into proc-macro .so
      # files that rustc dlopens and *executes* during macro expansion, so a
      # libnapi_derive built on a wider-ISA runner crashes rustc with SIGILL when
      # restored onto a narrower one. Pin a baseline every runner supports.
      RUSTFLAGS: -C target-cpu=x86-64-v2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:core
      - run: pnpm run typecheck:extensions
      # The unit suite drives fault injection through the native engine, and the
      # pinned @opengsd/engine-* binary lags the Rust source. Build the addon from
      # this commit with the test-only feature so those exports exist — without it
      # the loader silently falls back to the pinned binary and the
      # migrate-safety-audit suite fails on setMutationBoundaryFaultForTest.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          # The RUSTFLAGS baseline is part of the key: entries built under the
          # old `target-cpu=native` flags are not portable and must not restore.
          key: cargo-${{ runner.os }}-x86-64-v2-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-x86-64-v2-
      - run: pnpm run build:native:test
      - run: pnpm run test:unit
