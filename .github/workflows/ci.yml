name: CI
on:
  pull_request:
    branches:
      - main
jobs:
  fast-gates:
    if: startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the scans diff against the base ref, and a local
      # verify:fast falls back to git merge-base, which a shallow clone lacks.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # ci-fast-gates.sh runs actionlint only when it is on PATH, so without
      # this step the workflow static-analysis gate would silently self-skip in
      # the one place it is meant to block.
      - name: Install actionlint
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.7
          ACTIONLINT_SHA256=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          TARBALL="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # Verified before extraction: /usr/local/bin is world-writable and on
          # PATH, so an unchecked tarball would be an easy foothold in the job
          # that runs this repo's secret scans.
          curl -sSfL -o "$TARBALL" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${TARBALL}"
          echo "${ACTIONLINT_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" -C /usr/local/bin actionlint
          rm "$TARBALL"
      - run: bash scripts/ci-fast-gates.sh
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  build-and-test:
    if: startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dead-code gate. Runs on source, so it needs no build and can fail in
      # about a minute, before the expensive build/test steps below.
      - run: pnpm run lint:dead-code
      # Interface-property dead-code gate (#185). knip's member analysis covers
      # classes and enums only; this covers never-read interface properties.
      - run: pnpm run lint:dead-code:props
      - run: pnpm run build:core
      - run: pnpm run typecheck:extensions
      # The unit suite drives fault injection through the native engine, and the
      # pinned @opengsd/engine-* binary lags the Rust source. Build the addon from
      # this commit with the test-only feature so those exports exist — without it
      # the loader silently falls back to the pinned binary and the
      # migrate-safety-audit suite fails on setMutationBoundaryFaultForTest.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      # native/.cargo/config.toml builds with `-C target-cpu=native` for local dev
      # and expects CI to override it via RUSTFLAGS. Without that override the
      # cached native/target above is not portable: the runner fleet is
      # heterogeneous, so a proc-macro .so built with one runner's instruction set
      # gets restored onto a narrower one, and rustc dies with SIGILL when it
      # dlopens napi_derive to expand the macro. Any non-empty RUSTFLAGS replaces
      # the config.toml rustflags wholesale, which drops target-cpu=native.
      - run: pnpm run build:native:test
        env:
          RUSTFLAGS: -C debuginfo=0
      - run: pnpm run test:unit
